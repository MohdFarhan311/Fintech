apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: flextenure
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: flextenure
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
