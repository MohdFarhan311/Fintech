apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init
  namespace: flextenure
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: flextenure
data:
  init.js: |
    // The official MongoDB image runs this only when /data/db is empty.
    // The user-setup Job also reconciles this account on later deployments.
    const appDatabase = db.getSiblingDB('flextenure');
    appDatabase.createUser({
      user: process.env.MONGO_APP_USERNAME,
      pwd: process.env.MONGO_APP_PASSWORD,
      roles: [{ role: 'readWrite', db: 'flextenure' }],
    });
  setup.js: |
    // Reconcile the application account even for an already initialized volume.
    const appDatabase = db.getSiblingDB('flextenure');
    const username = process.env.MONGO_APP_USERNAME;
    const password = process.env.MONGO_APP_PASSWORD;

    if (!username || !password) {
      throw new Error('MONGO_APP_USERNAME and MONGO_APP_PASSWORD are required');
    }

    if (appDatabase.getUser(username)) {
      appDatabase.updateUser(username, {
        pwd: password,
        roles: [{ role: 'readWrite', db: 'flextenure' }],
      });
    } else {
      appDatabase.createUser({
        user: username,
        pwd: password,
        roles: [{ role: 'readWrite', db: 'flextenure' }],
      });
    }
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-internal
  namespace: flextenure
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: flextenure
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: flextenure
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: flextenure
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: flextenure
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: flextenure
spec:
  serviceName: mongodb-internal
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/part-of: flextenure
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: mongodb
          image: mongo:7.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: mongodb
              containerPort: 27017
              protocol: TCP
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: MONGO_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: MONGO_ROOT_PASSWORD
            - name: MONGO_INITDB_DATABASE
              value: flextenure
            - name: MONGO_APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: MONGO_APP_USERNAME
            - name: MONGO_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: MONGO_APP_PASSWORD
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - >-
                  mongosh --quiet
                  --username "$MONGO_INITDB_ROOT_USERNAME"
                  --password "$MONGO_INITDB_ROOT_PASSWORD"
                  --authenticationDatabase admin
                  --eval "db.adminCommand('ping').ok"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - >-
                  mongosh --quiet
                  --username "$MONGO_INITDB_ROOT_USERNAME"
                  --password "$MONGO_INITDB_ROOT_PASSWORD"
                  --authenticationDatabase admin
                  --eval "db.adminCommand('ping').ok"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - >-
                  mongosh --quiet
                  --username "$MONGO_INITDB_ROOT_USERNAME"
                  --password "$MONGO_INITDB_ROOT_PASSWORD"
                  --authenticationDatabase admin
                  --eval "db.adminCommand('ping').ok"
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d/10-init.js
              subPath: init.js
              readOnly: true
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-data
        - name: init-script
          configMap:
            name: mongodb-init
            items:
              - key: init.js
                path: init.js
